[project]
name = "rfnry-memory"
version = "0.1.0"
description = "Hybrid-retrieval memory system for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{name = "rfnry", email = "contact@rfnry.dev"}]
dependencies = [
    "pydantic>=2.13.4",
]

[project.urls]
Repository = "https://github.com/rfnry/memory"
Documentation = "https://github.com/rfnry/memory/blob/main/docs/memory.md"
Issues = "https://github.com/rfnry/memory/issues"

[project.scripts]
rfnry-memory = "rfnry_memory.cli:main"

[project.optional-dependencies]
postgres = ["asyncpg>=0.31.0,<1.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "asyncpg>=0.31.0,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfnry_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "live: calls real models (set RFNRY_LIVE_ADAPTERS to a module path)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "rfnry_memory.ranking.BM25",
    "rfnry_memory.ranking.bm25.BM25",
    "rfnry_memory.fusion.RRF",
    "rfnry_memory.fusion.rrf.RRF",
]

[tool.poe.tasks]
format = { cmd = "ruff format src tests" }
check = { cmd = "ruff check src tests" }
"check:fix" = { cmd = "ruff check --fix src tests" }
typecheck = { cmd = "mypy" }
test = { cmd = "pytest -q" }
"test:integration" = { cmd = "pytest -q tests/integration" }
"test:e2e" = { cmd = "pytest -q -m live" }

[tool.mypy]
strict = true
files = ["src/rfnry_memory", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
