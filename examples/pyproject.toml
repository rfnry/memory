[project]
name = "rfnry-memory-examples"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "rfnry-memory[postgres]",
    "rfnry-harness",
    "anthropic>=0.70",
    "voyageai>=0.3",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["ruff>=0.16.4"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-memory = { path = "../packages/python", editable = true }
rfnry-harness = { path = "../../harness/packages/python", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["models"]
