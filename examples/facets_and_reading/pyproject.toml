[project]
name = "facets_and_reading"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "rfnry-memory",
    "voyageai",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-memory = { path = "../../packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["harness", "providers"]
