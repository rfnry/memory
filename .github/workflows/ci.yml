name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    uses: rfnry/tools/.github/workflows/gate.yml@a0ca9591b09d538d59ddca5616e0669f75c2a30e
