name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    uses: rfnry/tools/.github/workflows/gate.yml@1a88583be2645ac8bda8a66a55616f0605add8c6
